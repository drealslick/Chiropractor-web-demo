name: Deploy Firebase Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - '.github/workflows/deploy-firebase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate explicit deployment target and credentials
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing GitHub Actions variable FIREBASE_PROJECT_ID. Deployment cannot choose a project implicitly."
            exit 1
          fi
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_TOKEN. Firebase was NOT deployed."
            exit 1
          fi
          case "$FIREBASE_PROJECT_ID" in
            demo-*)
              echo "::error::Do not deploy to Firebase emulator demo project IDs."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies & Build
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Deploy only Firebase backend components
        uses: w9jds/firebase-action@v15.30.0
        with:
          args: deploy --project ${{ vars.FIREBASE_PROJECT_ID }} --only functions,firestore:rules,firestore:indexes,storage --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
